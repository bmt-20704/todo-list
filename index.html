<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f5f1" />
  <title>오늘의 집중</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 9.2 17 19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div class="top-meta">
        <span class="today-label" id="todayLabel"></span>
        <span class="streak"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12.5 22c4.1 0 7-2.8 7-6.7 0-2.9-1.7-5-3.8-6.5.1 2.2-1.2 3.3-2 3.5.5-4.3-2-7.4-5-9.3.5 3.6-3.7 6.2-3.7 11.4C5 18.7 8 22 12.5 22Z" fill="currentColor"/></svg><span id="streakLabel">0일 연속</span></span>
      </div>
    </header>

    <main>
      <section class="intro">
        <div class="eyebrow">YOUR DAILY SPACE</div>
        <h1>오늘도, 하나씩 해내봐요.</h1>
        <p>완벽하게 말고, 꾸준하게. 지금 할 일에 집중해 보세요.</p>
      </section>

      <div class="content-grid">
        <section class="card task-card" aria-labelledby="tasksTitle">
          <div class="section-heading">
            <h2 id="tasksTitle">오늘의 할 일</h2>
            <span class="count-pill" id="taskCount">0</span>
          </div>
          <form class="task-form" id="taskForm">
            <input class="task-input" id="taskInput" type="text" maxlength="100" placeholder="새로운 할 일을 적어보세요" autocomplete="off" aria-label="새로운 할 일" />
            <button class="add-button" type="submit" aria-label="할 일 추가"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          </form>
          <div class="task-tabs" role="tablist" aria-label="할 일 상태">
            <button class="task-tab selected" type="button" role="tab" aria-selected="true" data-filter="todo"><span>해야 할 일</span><span class="tab-count" id="todoCount">0</span></button>
            <button class="task-tab" type="button" role="tab" aria-selected="false" data-filter="doing"><span>진행 중</span><span class="tab-count" id="doingCount">0</span></button>
            <button class="task-tab" type="button" role="tab" aria-selected="false" data-filter="done"><span>완료</span><span class="tab-count" id="completedCount">0</span></button>
          </div>
          <div class="task-list" id="taskList" aria-live="polite"></div>
          <div class="task-footer"><span id="remainingLabel">할 일을 추가해 보세요</span><button class="text-button" id="clearCompleted" type="button">완료한 일 지우기</button></div>
        </section>

        <aside class="focus-column">
          <section class="card timer-card" aria-labelledby="timerTitle">
            <div class="timer-heading">
              <h2 id="timerTitle">집중 타이머</h2>
              <span class="timer-session" id="sessionLabel">FOCUS 01</span>
            </div>
            <div class="mode-tabs" role="group" aria-label="타이머 모드">
              <button class="mode-button selected" type="button" data-mode="focus">집중</button>
              <button class="mode-button" type="button" data-mode="short">짧은 휴식</button>
              <button class="mode-button" type="button" data-mode="long">긴 휴식</button>
            </div>
            <div class="timer-display" id="timerDisplay" role="timer" aria-live="off">25:00</div>
            <div class="timer-caption" id="timerCaption">지금은 <span>나만의 집중 시간</span></div>
            <div class="timer-progress-wrap" aria-label="집중 타이머 진행률">
              <div class="timer-progress-label"><span>집중 진행률</span><span id="timerProgressValue">0.0%</span></div>
              <div class="timer-progress-track"><div class="timer-progress-bar" id="timerProgressBar" role="progressbar" aria-label="집중 타이머 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div>
            </div>
            <div class="timer-controls">
              <button class="start-button" id="startButton" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.8c0-.8.9-1.3 1.6-.9l9.1 5.3c.7.4.7 1.3 0 1.7l-9.1 5.3c-.7.4-1.6-.1-1.6-.9V5.8Z"/></svg><span>집중 시작</span></button>
              <button class="reset-button" id="resetButton" type="button" aria-label="타이머 초기화"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 11a7.5 7.5 0 1 1 .7 4.2M4 5.5V11h5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </section>

          <section class="card stats-card" aria-label="오늘의 집중 통계">
            <h2 class="stats-title">오늘의 기록</h2>
            <div class="stats-grid">
              <div class="stat"><div class="stat-value"><span id="focusCount">0</span><small>회</small></div><div class="stat-label">집중 세션</div></div>
              <div class="stat"><div class="stat-value"><span id="focusMinutes">0</span><small>분</small></div><div class="stat-label">집중한 시간</div></div>
              <div class="stat"><div class="stat-value"><span id="doneCount">0</span><small>개</small></div><div class="stat-label">완료한 할 일</div></div>
            </div>
          </section>

          <section class="card progress-card" aria-label="오늘의 할 일 진행률">
            <div class="progress-copy"><span>오늘의 진행률</span><span id="progressPercent">0%</span></div>
            <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
            <p class="progress-note" id="progressNote">첫 번째 할 일을 추가해 볼까요?</p>
          </section>
        </aside>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
